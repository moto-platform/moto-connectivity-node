; moto-connectivity-node -- PlatformIO with Arduino as an ESP-IDF component (D-023).
; Build:  pio run -e esp32-s3-devkitc-1         (real CAN/UDS, temporary vehicle-bus tester)
;         pio run -e esp32-s3-devkitc-1-mock    (synthetic telemetry, no ECU needed)
;         pio run -e esp32-s3-devkitc-1-listen-only (CAN capture probe, never transmits)
; Tests:  pio test -e native                    (host, no device; or scripts/native_tests.sh)
; Needs:  git submodule update --init  (external/moto-vehicle-defs, generated gen/c/conn/)
;         platformio_local.ini with AP_PASSWORD (copy platformio_local.ini.example)

[platformio]
extra_configs = platformio_local.ini

; Per-developer secrets (AP_PASSWORD) come from platformio_local.ini, which overrides this
; empty default. It is gitignored; see platformio_local.ini.example.
[local]
build_flags =

[env:esp32-s3-devkitc-1]
; espressif32 6.x = Arduino-ESP32 2.0.x on ESP-IDF 4.4, the combination the legacy code
; was verified with (esp_task_wdt_init / driver/twai.h APIs as used in src/).
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
; CONN_VEHICLE_TESTER=1: this node is the temporary sole vehicle-bus tester until
; moto-rt-core polls the ECU (D-021, D-023). See src/main.cpp before changing it.
build_flags =
    -D CONN_VEHICLE_TESTER=1
    ${local.build_flags}
; test/test_embedded needs Unity running ON the device (Serial output); requires
; the board connected over USB. See [env:native] for hardware-independent tests.
test_filter = test_embedded

; Mock telemetry environment: identical hardware target, but MOCK_CAN_DATA swaps
; HondaCANModule out for MockCANModule (see src/main.cpp) so Nextion/BLE/WiFi/
; staleness/watchdog behavior can be verified on the real ESP32-S3 board with no
; Honda ECU/CAN transceiver attached.
; Build/upload with: pio run -e esp32-s3-devkitc-1-mock -t upload
[env:esp32-s3-devkitc-1-mock]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -D MOCK_CAN_DATA

; Poller-off build (D-021): for when moto-rt-core polls the ECU. The TWAI driver is
; never installed, so this node cannot transmit on any CAN bus.
; Build with: pio run -e esp32-s3-devkitc-1-no-tester
[env:esp32-s3-devkitc-1-no-tester]
extends = env:esp32-s3-devkitc-1
build_flags =
    -D CONN_VEHICLE_TESTER=0
    ${local.build_flags}

; CAN capture probe (D-058 item 4, Q-001): TWAI in listen-only (bus monitoring) mode, every
; received frame and a per-ID summary streamed over USB serial at 921600 baud. A different
; firmware, not a tester: CONN_VEHICLE_TESTER=0 (no poller) plus its own flag
; CONN_CAN_LISTEN_ONLY=1 (the build fails if combined with the tester or the mock). Only
; CanCaptureModule runs; TwaiCanBus (the class that can transmit) is not compiled, and CI
; checks that the ELF has no twai_transmit symbol (scripts/check_no_twai_tx.sh).
; Build with: pio run -e esp32-s3-devkitc-1-listen-only
[env:esp32-s3-devkitc-1-listen-only]
extends = env:esp32-s3-devkitc-1
monitor_speed = 921600
build_flags =
    -D CONN_VEHICLE_TESTER=0
    -D CONN_CAN_LISTEN_ONLY=1
    -D CONN_SERIAL_BAUD=921600
    ${local.build_flags}

; G5.1/G5.2 -- Native (host-compiled, no ESP32/device attached) test environment.
; Covers the hardware-independent pieces: SystemState staleness, the BLE packet layout,
; the Wi-Fi JSON builder, HondaCANModule's UDS logic against a MockCanBus and the CAN capture
; probe against a MockCanRx. Does NOT
; build src/ (most of it needs ESP32-only libraries); each suite includes the sources
; it tests directly, plus the generated external/moto-vehicle-defs/gen/c/conn/ code.
[env:native]
platform = native
build_flags = -std=c++11 -pthread -Wall -Wextra -D CONN_NATIVE_TEST -I test/native_stubs -I external/moto-vehicle-defs/gen/c/conn
test_filter = test_native, test_can_protocol, test_can_capture
test_build_src = no
