name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # This repo is checked out with the default GITHUB_TOKEN. The private submodule
      # external/moto-vehicle-defs needs the org secret MOTO_DEFS_TOKEN (fine-grained,
      # Contents: read on moto-vehicle-defs only), so it is fetched in a separate step:
      # passing that token to actions/checkout would also use it for THIS repo, which it
      # cannot read. Never vendor the defs into this repo to make CI pass.
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Don't persist GITHUB_TOKEN: git would send it (via an included credentials config)
          # instead of the MOTO_DEFS_TOKEN URL credentials and the defs clone gets 403.
          persist-credentials: false

      - name: Fetch moto-vehicle-defs submodule (MOTO_DEFS_TOKEN)
        env:
          MOTO_DEFS_TOKEN: ${{ secrets.MOTO_DEFS_TOKEN }}
        run: |
          if [ -z "$MOTO_DEFS_TOKEN" ]; then
            echo "::error::Secret MOTO_DEFS_TOKEN (fine-grained PAT, Contents: read on moto-vehicle-defs) is not available. On the Free plan add it as a REPOSITORY secret."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${MOTO_DEFS_TOKEN}@github.com/moto-platform/moto-vehicle-defs".insteadOf \
            "https://github.com/moto-platform/moto-vehicle-defs"
          git submodule sync --recursive
          git submodule update --init --recursive
          git -C external/moto-vehicle-defs describe --tags --always

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

      # D-032: the telemetry v3/v2 structs and the IMU block packer must match
      # docs/ble_telemetry_packet_schema.json field by field (g++ probe, no device).
      - name: Check BLE layouts against the schema
        run: python3 scripts/check_ble_schema.py

      # The Bluedroid build needs the BLE 4.2 feature set (legacy advertising/GATT API used
      # by BLEServerModule); sdkconfig.defaults must keep it.
      - name: Check required sdkconfig options
        run: grep -qx 'CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y' sdkconfig.defaults

      # G4.1 requires AP_PASSWORD from a gitignored platformio_local.ini that does
      # not exist in CI. Build-verification-only placeholder, never flashed.
      - name: Provide CI-only build password
        run: |
          echo '[local]' > platformio_local.ini
          echo 'build_flags = -D AP_PASSWORD=\"CIBuildOnlyPlaceholder123\"' >> platformio_local.ini

      - name: Build firmware (real CAN/UDS, temporary vehicle-bus tester)
        run: pio run -e esp32-s3-devkitc-1

      - name: Build firmware (mock telemetry)
        run: pio run -e esp32-s3-devkitc-1-mock

      - name: Build firmware (poller off, D-021)
        run: pio run -e esp32-s3-devkitc-1-no-tester
