name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Pinned, like the cppcheck cache key below.
    runs-on: ubuntu-24.04
    steps:
      # moto-vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/moto-vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/moto-vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/moto-vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      # Same cppcheck as moto-vehicle-defs: 2.22.0, built once and cached. Ubuntu's apt
      # cppcheck (2.13) grades some checks differently, so local and CI runs would disagree.
      - name: Restore cppcheck 2.22.0
        id: cppcheck
        uses: actions/cache/restore@v4
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Build cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          git clone --quiet --depth 1 --branch 2.22.0 https://github.com/danmar/cppcheck.git "$RUNNER_TEMP/cppcheck-src"
          cmake -S "$RUNNER_TEMP/cppcheck-src" -B "$RUNNER_TEMP/cppcheck-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j "$(nproc)"
          cp -r "$RUNNER_TEMP/cppcheck-build/bin" ~/cppcheck

      - name: Save cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Use cppcheck 2.22.0
        run: |
          echo "$HOME/cppcheck" >> "$GITHUB_PATH"
          "$HOME/cppcheck/cppcheck" --version

      # D-046 item 3: warning/portability/performance findings block. The ESP-IDF and
      # Arduino headers are not on the include path, so they are never analysed.
      - name: Static analysis (cppcheck, blocking)
        run: |
          cppcheck --std=c++11 --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem \
            -I src -I external/moto-vehicle-defs/gen/c/conn src

      # D-046 item 3: the MISRA C:2012 addon only reports here. conn is temporary and not
      # safety-related; its vehicle-bus safety rests on the gen/c gates, which are
      # MISRA-checked in moto-vehicle-defs, and on tester_policy. conn is C++, so the C:2012
      # rules are indicative only. misra-config (identifiers from the absent ESP-IDF headers,
      # C++ keywords) and external/ (checked in moto-vehicle-defs) are left out.
      - name: MISRA C:2012 + style report (cppcheck, non-blocking)
        continue-on-error: true
        run: |
          cppcheck --std=c++11 --enable=style --addon=misra --inline-suppr --quiet \
            --suppress=missingIncludeSystem --suppress=misra-config '--suppress=*:*external/*' \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            -I src -I external/moto-vehicle-defs/gen/c/conn src 2> misra-report.txt
          cat misra-report.txt
          {
            echo "### MISRA C:2012 + style report (non-blocking, D-046): $(wc -l < misra-report.txt) findings"
            echo '```'
            cat misra-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

      # The Bluedroid build needs the BLE 4.2 feature set (legacy advertising/GATT API used
      # by BLEServerModule). D-058 / D-037: TWAI listen-only on the ESP32-S3 sends dominant
      # error flags unless the errata workaround is on (capture env and tester listen window).
      - name: Check required sdkconfig options
        run: |
          grep -qx 'CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y' sdkconfig.defaults
          grep -qx 'CONFIG_TWAI_ERRATA_FIX_LISTEN_ONLY_DOM=y' sdkconfig.defaults

      # G4.1 requires AP_PASSWORD from a gitignored platformio_local.ini that does
      # not exist in CI. Build-verification-only placeholder, never flashed.
      - name: Provide CI-only build password
        run: |
          echo '[local]' > platformio_local.ini
          echo 'build_flags = -D AP_PASSWORD=\"CIBuildOnlyPlaceholder123\"' >> platformio_local.ini

      - name: Build firmware (real CAN/UDS, temporary vehicle-bus tester)
        run: pio run -e esp32-s3-devkitc-1

      - name: Build firmware (mock telemetry)
        run: pio run -e esp32-s3-devkitc-1-mock

      - name: Build firmware (poller off, D-021)
        run: pio run -e esp32-s3-devkitc-1-no-tester

      - name: Build firmware (listen-only CAN capture, D-058)
        run: pio run -e esp32-s3-devkitc-1-listen-only

      # D-058 item 4 / D-037: the capture firmware links no TWAI transmit code (the tester
      # ELF is the positive control), and both builds have the listen-only errata workaround.
      - name: Listen-only firmware has no TWAI transmit and no dominant error flag
        run: scripts/check_no_twai_tx.sh
