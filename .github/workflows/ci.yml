name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # external/moto-vehicle-defs is a private sibling repo: the default GITHUB_TOKEN
      # cannot read it. DEFS_READ_TOKEN = fine-grained token with contents:read on
      # moto-connectivity-node and moto-vehicle-defs (repository secret).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEFS_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

      # G4.1 requires AP_PASSWORD from a gitignored platformio_local.ini that does
      # not exist in CI. Build-verification-only placeholder, never flashed.
      - name: Provide CI-only build password
        run: |
          echo '[local]' > platformio_local.ini
          echo 'build_flags = -D AP_PASSWORD=\"CIBuildOnlyPlaceholder123\"' >> platformio_local.ini

      - name: Build firmware (real CAN/UDS)
        run: pio run -e esp32-s3-devkitc-1

      - name: Build firmware (mock telemetry)
        run: pio run -e esp32-s3-devkitc-1-mock
